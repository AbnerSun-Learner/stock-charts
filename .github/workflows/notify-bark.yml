name: Notify Bark on Deploy

on:
  deployment_status:

permissions:
  contents: read

jobs:
  notify:
    if: >
      contains(fromJSON('["success","failure","error"]'), github.event.deployment_status.state) &&
      github.event.deployment.creator.login == 'vercel[bot]' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - name: Send Bark notification
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          DEPLOY_URL: ${{ github.event.deployment_status.environment_url }}
          DEPLOY_STATE: ${{ github.event.deployment_status.state }}
          DEPLOY_DESC: ${{ github.event.deployment_status.description }}
          REPO_NAME: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.deployment.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$BARK_KEY" ]; then
            echo "::warning::未配置 BARK_KEY，跳过通知"
            exit 0
          fi

          # 元数据查询失败时仍继续推送，避免告警链路整体中断
          BRANCH=$(gh api "repos/${REPO_NAME}/commits/${COMMIT_SHA}/branches-where-head" --jq '.[0].name // "main"' || echo "unknown")
          COMMIT_MSG=$(gh api "repos/${REPO_NAME}/commits/${COMMIT_SHA}" --jq '.commit.message | split("\n") | .[0]' || echo "(获取失败)")

          if [ "$DEPLOY_STATE" = "success" ]; then
            TITLE="Vercel 部署成功"
          else
            TITLE="Vercel 部署失败"
          fi

          BODY=$(printf "仓库: %s\n分支: %s\nCommit Message: %s" "$REPO_NAME" "$BRANCH" "$COMMIT_MSG")
          if [ "$DEPLOY_STATE" != "success" ] && [ -n "$DEPLOY_DESC" ]; then
            BODY=$(printf "%s\n错误: %s" "$BODY" "$DEPLOY_DESC")
          fi

          curl -sf -X POST "https://api.day.app/push" \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "$(jq -n \
              --arg key "$BARK_KEY" \
              --arg title "$TITLE" \
              --arg body "$BODY" \
              --arg group "stock-charts" \
              --arg url "${DEPLOY_URL:-https://github.com/${REPO_NAME}}" \
              '{device_key: $key, title: $title, body: $body, group: $group, url: $url, sound: "minuet"}')"
